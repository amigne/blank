# CI Pipeline (GitHub Actions, self-hosted runner)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  # ── Backend lint & format ──────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Format
    runs-on: self-hosted
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2 (node24 runtime)
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Format check (ruff)
        run: uvx ruff format --check .

  # ── Security audit — backend dependencies ──────────────────────────────
  audit-backend:
    name: Security Audit — Backend Deps
    runs-on: self-hosted
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2 (node24 runtime)
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync backend dependencies
        run: uv sync --locked --group dev

      - name: Audit dependencies
        run: uv run pip-audit