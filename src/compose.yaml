name: "${MYAPP_PROJECT_NAME:-myapp}"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: "${MYAPP_POSTGRES_IMAGE:?Define MYAPP_POSTGRES_IMAGE}"
    environment:
      POSTGRES_DB: "${MYAPP_DATABASE_NAME:?Define MYAPP_DATABASE_NAME}"
      POSTGRES_USER: "${MYAPP_DATABASE_USER:?Define MYAPP_DATABASE_USER}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - backend_net

  backend:
    image: "${MYAPP_BACKEND_IMAGE:?Define MYAPP_BACKEND_IMAGE}"
    init: true
    environment:
      ENVIRONMENT: "${MYAPP_APP_ENVIRONMENT:?Define MYAPP_APP_ENVIRONMENT}"
      LOG_LEVEL: "${MYAPP_LOG_LEVEL:-INFO}"
      # PUBLIC_BASE_URL: "${MYAPP_PUBLIC_BASE_URL:?Define MYAPP_PUBLIC_BASE_URL}"

      HEALTH_FULL_TOKEN_FILE: /run/secrets/health_full_token
      # SECRET_KEY_FILE: /run/secrets/backend_secret_key

      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: "${MYAPP_DATABASE_NAME:?Define MYAPP_DATABASE_NAME}"
      DATABASE_USER: "${MYAPP_DATABASE_USER:?Define MYAPP_DATABASE_USER}"
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

      DOCS_URL: "${MYAPP_BACKEND_DOCS_URL}"
      REDOC_URL: "${MYAPP_BACKEND_REDOC_URL}"
      OPENAPI_URL: "${MYAPP_BACKEND_OPENAPI_URL}"

    secrets:
      - postgres_password
      - health_full_token
      # - backend_secret_key
    depends_on:
      db:
        condition: service_healthy
        restart: true
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - edge
      - backend_net

  # frontend:
  #   image: "${MYAPP_FRONTEND_IMAGE:?Define MYAPP_FRONTEND_IMAGE}"
  #   init: true
  #   environment:
  #     NODE_ENV: "${MYAPP_NODE_ENV:-production}"
  #     APP_ENV: "${MYAPP_APP_ENV:?Define MYAPP_APP_ENV}"
  #     PUBLIC_API_BASE_URL: "${MYAPP_PUBLIC_API_BASE_URL:-/api}"
  #   expose:
  #     - "3000"
  #   healthcheck:
  #     test:
  #       - CMD
  #       - node
  #       - -e
  #       - >-
  #         const net=require('net');
  #         const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)});
  #         socket.on('error',()=>process.exit(1));
  #         setTimeout(()=>process.exit(1),3000);
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   logging: *default-logging
  #   networks:
  #     - edge

  caddy:
    image: "${MYAPP_CADDY_IMAGE:?Define MYAPP_CADDY_IMAGE}"
    environment:
      APP_ADDRESS: "${MYAPP_APP_ADDRESS:?Define MYAPP_APP_ADDRESS}"
      ACME_EMAIL: "${MYAPP_ACME_EMAIL-}"
    volumes:
      - type: bind
        source: "${MYAPP_CADDYFILE:?Define MYAPP_CADDYFILE}"
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    depends_on:
      backend:
        condition: service_healthy
      # frontend:
      #   condition: service_healthy
    logging: *default-logging
    networks:
      - edge

secrets:
  postgres_password:
    file: "${MYAPP_POSTGRES_PASSWORD_SECRET_FILE:?Define MYAPP_POSTGRES_PASSWORD_SECRET_FILE}"

  # Secret non câblé : aucun service ne le consomme et Settings n'a pas de champ
  # SECRET_KEY. À décommenter (ici + service backend + env/*) le jour où il servira.
  # backend_secret_key:
  #   file: "${MYAPP_BACKEND_SECRET_KEY_FILE:?Define MYAPP_BACKEND_SECRET_KEY_FILE}"

  health_full_token:
    file: "${MYAPP_HEALTH_FULL_TOKEN_FILE:?Define MYAPP_HEALTH_FULL_TOKEN_FILE}"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend_net:
    internal: true
