services:
  db:
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
        tmpfs:
          size: 536870912

  backend:
    build:
      dockerfile: docker/app/Dockerfile.backend    
      context: .
      target: test
      args:
        PYTHON_IMAGE: "${MYAPP_PYTHON_IMAGE:-python:3.14-slim}"
    command:
      - pytest
      - -q
    environment:
      ENVIRONMENT: test
      LOG_LEVEL: "${MYAPP_LOG_LEVEL:-WARNING}"

  frontend:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.frontend
      target: test
      args:
        NODE_IMAGE: "${MYAPP_NODE_IMAGE:-node:24.18.0-alpine}"
    environment:
      NODE_ENVIRONMENT: test

  caddy:
    profiles:
      - proxy
