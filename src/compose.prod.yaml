services:
  db:
    pull_policy: always
    restart: always
    security_opt:
      - no-new-privileges:true

  backend:
    pull_policy: always
    restart: always
    environment:
      ENVIRONMENT: production
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  frontend:
    pull_policy: always
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  caddy:
    pull_policy: always
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
