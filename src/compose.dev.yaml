services:
  db:
    ports:
      - "127.0.0.1:${MYAPP_DATABASE_PORT:-5432}:5432"

  backend:
    build:
      dockerfile: ../docker/app/Dockerfile.backend
      context: ./backend
      target: development
      args:
        PYTHON_IMAGE: "${MYAPP_PYTHON_IMAGE:-python:3.14-slim}"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: "${MYAPP_LOG_LEVEL:-DEBUG}"
    volumes:
      - type: bind
        source: ./backend
        target: /app

